name: Harvest universe

# Collects the closed-end universe from the ASX monthly report and the AIC
# industry overview into one clean table of codes, market caps and NTAs.

on:
  workflow_dispatch:
  push:
    branches: [claude/closed-end-screening-engine-bw13wg]

concurrency: harvest
permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_harvest.py -q
      - name: Harvest
        run: python -m src.harvest.run
      # Always build the spreadsheet and the email body — they land in the
      # artifact either way, so a run without mail credentials still leaves
      # the full deliverable behind.
      - name: Build spreadsheet + email body
        run: python -m src.harvest.email_report --dry-run
      # Sends only when the repository has Gmail credentials:
      #   GMAIL_USERNAME      the sending Gmail address
      #   GMAIL_APP_PASSWORD  an app password (myaccount.google.com/apppasswords)
      #   MAIL_TO             optional; defaults to GMAIL_USERNAME
      - name: Email the report
        if: ${{ secrets.GMAIL_APP_PASSWORD != '' }}
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m src.harvest.email_report
      # Last step on purpose: these few rows answer whether the derived UK
      # discount is trustworthy, and the tail of the log is where that is
      # readable. 3i has traded at a premium for years and City of London near
      # par; if they come out deeply discounted the AIC asset figure is gross
      # of gearing and every geared fund is being flattered.
      - name: Canary check on the derived UK discounts
        if: always()
        run: |
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("data/universe.csv")))
          print(f"total rows: {len(rows)}")
          uk = [r for r in rows if r["exchange"] == "LSE"]
          der = [r for r in uk if r["discount_basis"] == "mcap_over_nta_total"]
          print(f"LSE rows: {len(uk)}  with derived discount: {len(der)}")
          print(f"\n{'code':7}{'name':34}{'mkt cap':>16}{'NTA total':>16}{'disc':>9}")
          for code in ("III", "CTY", "SMT", "FCIT", "HICL", "UKW", "PSH", "HVPE"):
              r = next((x for x in rows if x["code"] == code), None)
              if not r:
                  print(f"{code:7}(not present)")
                  continue
              d = float(r["discount"]) * 100 if r["discount"] else None
              print(f"{code:7}{r['name'][:32]:34}{float(r['market_cap'] or 0):>16,.0f}"
                    f"{float(r['nta_total'] or 0):>16,.0f}"
                    f"{(f'{d:.1f}%' if d is not None else '—'):>9}")
          vals = sorted(float(r["discount"]) for r in der if r["discount"])
          if vals:
              q = lambda p: vals[int(len(vals) * p)]
              print(f"\nderived discount spread: p10={q(.10)*100:.1f}%  "
                    f"median={q(.50)*100:.1f}%  p90={q(.90)*100:.1f}%  "
                    f"premiums={sum(1 for v in vals if v > 0)}/{len(vals)}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universe-${{ github.run_id }}
          path: |
            data/universe.csv
            data/universe_dropped.csv
            data/universe.xlsx
            data/email.html
          if-no-files-found: warn
