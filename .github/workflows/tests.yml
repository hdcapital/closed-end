name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Both gates are fully offline, so CI never depends on a third party's
      # uptime to tell us whether our own maths is right.
      - run: python -m pytest tests/ -q
      - run: python -m src.selftest
