name: Live smoke test

# The first real contact with the sources. The development session that wrote
# this engine had no network egress to asx.com.au, londonstockexchange.com,
# theaic.co.uk, nzx.com or Yahoo, so every collector here is code that has
# never seen a real document. This job is the integration test.
#
# It runs phase by phase and keeps going when a phase fails, because "which
# sources answered" is exactly the thing being measured. Nothing is committed;
# the store and report come back as artifacts.
#
# `push` is scoped to this branch so it fires without the workflow first having
# to land on the default branch — workflow_dispatch only registers from there.

on:
  workflow_dispatch:
    inputs:
      max_funds:
        description: "Cap funds in the price phase (blank = uncapped; Yahoo is the slow leg)"
        default: "40"
      archive_months:
        description: "Cap ASX archived monthly reports to fetch"
        default: "84"
  push:
    branches: [claude/closed-end-screening-engine-bw13wg]

concurrency: live-smoke-test

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline gates first
        run: |
          python -m pytest tests/ -q
          python -m src.selftest

      # Establish that the runner can actually reach each host before blaming
      # a parser for what is really a network result.
      - name: Reachability probe
        continue-on-error: true
        run: |
          for u in \
            "https://www.asx.com.au/issuers/investment-products/asx-investment-products-monthly-report" \
            "https://www.londonstockexchange.com/reports?tab=instruments" \
            "https://www.theaic.co.uk/aic/find-compare-investment-companies" \
            "https://www.nzx.com/markets/NZSX" \
            "https://query1.finance.yahoo.com/v8/finance/chart/AFI.AX?range=5d&interval=1d" ; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              -A "hdcapital-closed-end-screener/0.1" "$u" || echo "ERR")
            echo "  $code  $u"
          done

      - name: Trim the ASX archive for a bounded first run
        run: |
          python - <<'PY'
          import re, os
          months = os.environ.get("ARCHIVE_MONTHS") or "24"
          s = open("config.yaml").read()
          s = re.sub(r"(archive_months:\s*)\d+", r"\g<1>" + str(int(months)), s)
          open("config.yaml", "w").write(s)
          print(f"archive_months set to {months} for this run")
          PY
        env:
          ARCHIVE_MONTHS: ${{ inputs.archive_months || '84' }}

      - name: "Phase 1 — universe"
        continue-on-error: true
        run: python -m src.run --phase universe

      - name: "Phase 2 — NTA history"
        continue-on-error: true
        run: python -m src.run --phase history

      - name: "Phase 2b — prices"
        continue-on-error: true
        run: python -m src.run --phase prices --max-funds ${{ inputs.max_funds || '40' }}

      - name: "Phase 4 inputs — register"
        continue-on-error: true
        run: python -m src.run --phase holders
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_LAKE_PREFIX: "market-data/"

      - name: "Phases 3+4+5 — models and report"
        continue-on-error: true
        run: python -m src.run --phase report

      # The UK leg is the largest remaining gap; this reports which candidate
      # instrument-list file actually carries a ticker+ISIN header, so the fix
      # is one config line rather than another round of guessing.
      - name: "Probe — locate the LSE instrument list"
        continue-on-error: true
        run: python -m src.probe_uk

      - name: Diagnostics
        if: always()
        run: python -m src.diagnose

      # The cached documents are the evidence: if a parser found nothing, the
      # bytes it was given are in here.
      - name: Upload store, report and raw documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-${{ github.run_id }}
          path: |
            report/
            data/db/
            data/raw/
          if-no-files-found: warn
          retention-days: 7
